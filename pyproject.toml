[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[tool.coverage.run]
# Store source paths relative to the repo root so coverage reports (e.g.
# Coveralls) resolve files against the checkout regardless of install layout.
relative_files = true
source_pkgs = ["aiidalab_dlpoly"]


[tool.ruff]
target-version = "py310"
exclude = ["conf.py"]

[tool.ruff.lint]
select = [
    # flake8-bugbear
    "B",
    # pylint
    "C", "R",
    # pydocstyle
    "D",
    # pycodestyle
    "E", "W",
    # Pyflakes
    "F", "FA",
    # isort
    "I",
    # pep8-naming
    "N",
    # pyupgrade
    "UP",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
